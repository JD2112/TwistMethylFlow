name: Create Release on Version Bump

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'conf/base.config'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version
        id: extract_version
        run: |
          # Read version from conf/base.config
          VERSION=$(grep -E "^\s*version\s*=\s*'[^']+'" conf/base.config | sed -E "s/.*version\s*=\s*'([^']+)'.*/\1/")
          
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version."
            exit 1
          fi
          
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --tags origin refs/tags/v${{ env.version }} | grep -q 'refs/tags/v${{ env.version }}'; then
            echo "Tag v${{ env.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            Automated pipeline release for version **${{ env.version }}**. 
            To use this release, execute:
            `nextflow run JD2112/MethylFlow -r ${{ env.version }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
