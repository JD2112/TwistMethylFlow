description: "Detailed description of the analytical methods used in this pipeline."
data: |
    <div style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid #007bff;">
        <h4>Analysis Workflow</h4>
        <p>This pipeline was executed using <strong>milou</strong> (Methylation Integrated Layer for Omics Unification), a Nextflow-based framework for comprehensive DNA methylation analysis. The analytical workflow involves the following steps:</p>
        <ul>
            <li><strong>Read QC & Trimming:</strong> Raw reads were processed with <em>FastQC</em> and trimmed using <em>Cutadapt</em> (via TrimGalore).</li>
            <li><strong>Alignment:</strong> Bisulfite-converted reads were aligned to the reference genome using <em>Bismark</em> (or NVIDIA Parabricks for accelerated GPU analysis).</li>
            <li><strong>Methylation Extraction:</strong> DNA methylation levels were extracted and quantified using <em>Bismark Methylation Extractor</em> or <em>MethylDackel</em>.</li>
            <li><strong>Differential Methylation:</strong> Statistical analysis of differential methylation was performed using a consensus approach with <em>methylKit</em>, <em>DSS</em>, and <em>edgeR</em>.</li>
            <li><strong>Reporting:</strong> Final clinical-grade reports and quality metrics were generated by <em>MultiQC</em> and the internal Quarto-based reporting engine.</li>
        </ul>
        <p>For more information, visit the <a href="https://github.com/JD2112/milou">milou Documentation</a>.</p>
    </div>
