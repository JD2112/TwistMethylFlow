report_header_info:
    - MethylFlow: "MethylFlow DNA Methylation Data Analysis Pipeline"
    - Contact: "Jyotirmoy Das"
    - Project: "MethylFlow DNA Methylation Analysis"

report_comment: >
    This report has been generated by the <a href="https://github.com/JDCo/MethylFlow" target="_blank">MethylFlow</a> DNA methylation analysis pipeline.

report_section_order:
    "twistmethylflow-summary":
        order: -1002
    "software_versions":
        order: -1001
    "twistmethylflow-methods-description":
        order: -1000

custom_data:
    twistmethylflow-summary:
        file_format: "yaml"
        section_name: "MethylFlow Workflow Summary"
        description: "Parameters used for this pipeline run."
        plot_type: "html"
    software_versions:
        file_format: "yaml"
        section_name: "Software Versions"
        plot_type: "html"
    twistmethylflow-methods-description:
        file_format: "yaml"
        section_name: "MethylFlow Methods Description"
        plot_type: "html"

export_plots: true

# Aesthetics
title: "MethylFlow Analysis Report"
subtitle: "Comprehensive DNA Methylation Profiling"
project_name: "MethylFlow"

# Logo configuration
custom_logo: "methylflow_logo.png"
custom_logo_url: "https://github.com/JDCo/MethylFlow"

# Module ordering
run_modules:
    - fastqc
    - cutadapt
    - bismark
    - qualimap
    - custom_content

module_order:
    - fastqc
    - cutadapt
    - bismark
    - qualimap
    - custom_content
