report_header_info:
    - milou: "milou: Methylation Integrated Layer for Omics Unification"
    - Contact: "Jyotirmoy Das"
    - Project: "milou DNA Methylation Analysis"

report_comment: >
    This report has been generated by the <a href="https://github.com/JD2112/milou" target="_blank">milou</a> DNA methylation analysis pipeline.

report_section_order:
    "milou-summary":
        order: -1002
    "software_versions":
        order: -1001
    "milou-methods-description":
        order: -1000

custom_data:
    milou-summary:
        file_format: "yaml"
        section_name: "milou Workflow Summary"
        description: "Parameters used for this pipeline run."
        plot_type: "html"
    software_versions:
        file_format: "yaml"
        section_name: "Software Versions"
        plot_type: "html"
    milou-methods-description:
        file_format: "yaml"
        section_name: "milou Methods Description"
        plot_type: "html"

export_plots: true

# Aesthetics
title: "milou Analysis Report"
subtitle: "Comprehensive DNA Methylation Profiling"
project_name: "milou"

# Logo configuration
custom_logo: "milou_logo.png"
custom_logo_url: "https://github.com/JD2112/milou"

# Module ordering
run_modules:
    - fastqc
    - cutadapt
    - bismark
    - qualimap
    - custom_content

module_order:
    - fastqc
    - cutadapt
    - bismark
    - qualimap
    - custom_content
